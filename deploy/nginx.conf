# /etc/nginx/conf.d/stock.conf
# Static SPA from client/dist, API proxied to the Node process on 127.0.0.1:3000.

upstream stock_api {
  server 127.0.0.1:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name stock.example.local;

  root /var/www/stock/client/dist;
  index index.html;

  client_max_body_size 2m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://stock_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Hashed build output only — never cache index.html, or a deploy will look stale.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
